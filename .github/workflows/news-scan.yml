name: Scan news for bear sightings

on:
  schedule:
    - cron: "15 */2 * * *" # every 2 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Upserts candidates straight into Supabase's public.news table as
      # status='pending' (see docs/rls-audit.md's R7) — no PR/commit gate
      # for that part anymore, review happens in the Supabase dashboard.
      # Also rewrites feed.xml (the public RSS export) from whatever's
      # currently approved there, and reports how many candidates were
      # genuinely new this run via $GITHUB_OUTPUT.
      - name: Fetch & filter news
        id: scan
        run: node scripts/fetch-news.js

      - name: Commit feed.xml if it changed
        run: |
          if ! git diff --quiet -- feed.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add feed.xml
            git commit -m "Update feed.xml from approved news"
            git push
          fi

      # Only fires when this run actually found new candidates — most
      # 2-hourly runs find nothing, and firing on every run regardless
      # would mean an email every 2 hours no matter what.
      - name: Email a review reminder via Resend
        if: steps.scan.outputs.new_count > 0
        run: |
          curl -sf -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$(node -e '
              const n = process.env.NEW_COUNT;
              const payload = {
                from: process.env.RESEND_FROM,
                to: process.env.NEWS_REVIEW_EMAIL,
                subject: `Lacupedas: ${n} new bear-mention candidate(s) pending review`,
                text: `The news-scan workflow found ${n} new candidate(s) awaiting review.\n\nReview and approve/reject them in the Supabase Table Editor (public.news, status column) — see docs/rls-audit.md.`,
              };
              console.log(JSON.stringify(payload));
            ')"
        env:
          NEW_COUNT: ${{ steps.scan.outputs.new_count }}
          RESEND_FROM: ${{ secrets.RESEND_FROM_EMAIL }}
          NEWS_REVIEW_EMAIL: ${{ secrets.NEWS_REVIEW_EMAIL }}
