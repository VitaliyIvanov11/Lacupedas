name: Scan news for bear sightings

on:
  schedule:
    - cron: "15 */2 * * *" # every 2 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch & filter news
        run: node scripts/fetch-news.js

      - name: Commit updated data if changed
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No changes to data/news.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "Update bear-related news data [skip ci]"
          git push
