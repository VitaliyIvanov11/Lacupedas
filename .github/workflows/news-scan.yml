name: Scan news for bear sightings

on:
  schedule:
    - cron: "15 */2 * * *" # every 2 hours
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: news-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Fetch & filter news
        run: node scripts/fetch-news.js

      # No keyword filter catches everything (proper-noun collisions, brand
      # names, unrelated stories that happen to name-drop a bear — all
      # already seen in practice) and the cost of a wrong one going public
      # can be real, not just cosmetic. Nothing here reaches data/news.json
      # on main — and so nothing reaches the live site — without a human
      # reviewing and merging this PR first. Reuses one branch/PR across
      # runs until it's merged (or closed to reject), instead of opening a
      # new one every 2 hours.
      - name: Open or update a review PR with new candidates
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Update bear-related news data"
          branch: news-pending-review
          title: "News scan: new bear-mention candidates for review"
          body: |
            Automated keyword scan found new candidate item(s) below.
            **Nothing here is public until this PR is merged.**

            Before merging, check each new entry in the diff for:
            - A proper-noun collision (a person's surname, a sports team
              or brand name, etc. that happens to match the keyword —
              see `looksLikeProperNounCollision()`/`looksLikeBreadBrand()`
              in `scripts/fetch-news.js` for what's already auto-filtered).
            - Whether it's actually about a bear encounter/sighting, not
              just a passing mention (funding announcements, unrelated
              foreign-news stories, etc.).
            - Whether the auto-matched place/coordinates look right.

            To reject a specific item permanently: copy its `link` value
            into `EXCLUDED_LINKS` in `scripts/fetch-news.js` in a followup
            commit, then close this PR without merging (or remove just
            that item from the diff before merging the rest).
          add-paths: |
            data/news.json
            feed.xml
          labels: news-review
